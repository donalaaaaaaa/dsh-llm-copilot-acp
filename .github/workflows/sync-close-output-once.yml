name: sync-close-output-once

on:
  push:
    branches:
      - refactor/acp-hardening
    paths:
      - .github/workflows/sync-close-output-once.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/acp-hardening
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Commit compiled output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build: sync deterministic shutdown output"
          git push origin HEAD:refactor/acp-hardening
