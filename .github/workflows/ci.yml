name: ci

on:
  push:
    branches:
      - main
      - refactor/**
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Upload compiled lib
        uses: actions/upload-artifact@v4
        with:
          name: compiled-lib
          path: lib
      - name: Sync compiled lib on refactor branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/refactor/acp-hardening'
        run: |
          if git diff --quiet -- lib; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib
          git commit -m "build: sync compiled lib"
          git push origin HEAD:refactor/acp-hardening
      - name: Verify committed build output
        run: git diff --exit-code -- lib
      - name: Test
        run: pnpm test
