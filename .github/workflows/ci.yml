name: ci

on:
  push:
    branches:
      - main
      - refactor/**
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Upload compiled lib
        uses: actions/upload-artifact@v4
        with:
          name: compiled-lib
          path: lib
      - name: Verify committed build output
        run: git diff --exit-code -- lib
      - name: Test
        run: pnpm test
