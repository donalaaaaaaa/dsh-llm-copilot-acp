# ==============================================================================
# DeepSeek Harness Desktop - GitHub Copilot CLI ACP Provider Configuration
# ==============================================================================
#
# Add this block to:
# C:\Users\<Username>\.dsh\profiles\desktop\cordis.patch.yml
#
# Prerequisites:
# 1. npm install -g @github/copilot
# 2. copilot login
# 3. copilot --help | findstr acp
# ==============================================================================

- id: github-copilot-acp
  name: "@deepseek-ai/dsh-llm-copilot-acp"
  config:
    # Copilot CLI executable or absolute path.
    command: copilot

    # Safe default: start only the ACP server.
    # Add --allow-all-tools explicitly only if you really want Copilot-native
    # tools to run without per-operation permission.
    args:
      - "--acp"

    timeoutMs: 900000
    modelDiscoveryTimeoutMs: 10000

    # Kept for direct-constructor compatibility. With explicit args above this
    # flag does not append anything. Recommended default is false.
    allowAllTools: false

    # Optional ACP permission policy:
    #   deny | allow-once | allow-always
    #
    # Recommended: omit it. The adapter then defaults to:
    #   - deny when DSH tools are supplied, to reduce duplicate side effects
    #   - allow-once otherwise
    # permissionMode: allow-once

    # Allow ACP fs/read_text_file and fs/write_text_file inside the canonical
    # session cwd. Symlink/junction escapes are rejected.
    allowFileRequests: true

    # Optional explicit model catalog. Normally omit this and let the ACP
    # session advertise the account's actual model choices.
    # models:
    #   - id: "<advertised-model-id>"
    #     name: "<display-name>"
    #     inputModalities:
    #       - text

# Optional: configure a DSH default model only after model discovery shows the
# exact model id available to this Copilot account.
# - id: agent-default-model
#   name: "@deepseek-ai/dsh-agent-default-model"
#   config:
#     provider: github-copilot-acp
#     model: "<advertised-model-id>"

# Optional: same rule for subagents: use ids actually returned by discovery.
# - id: subagent-model-selection-settings
#   name: "@deepseek-ai/dsh-tool-subagent/model-selection-settings"
#   config:
#     enabled: true
#     allowedModels:
#       - provider: github-copilot-acp
#         model: "<advertised-model-id>"
