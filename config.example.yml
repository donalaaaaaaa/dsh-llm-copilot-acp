# ==============================================================================
# DeepSeek Harness Desktop - GitHub Copilot CLI ACP Provider Configuration
# ==============================================================================
#
# 该配置可直接添加到 C:\Users\<Username>\.dsh\profiles\desktop\cordis.patch.yml
# 或者作为独立的 Cordis 插件配置使用。
#
# 前置条件：
# 1. 安装官方 GitHub Copilot CLI:
#    npm install -g @github/copilot
# 2. 提前登录授权（只需在终端执行一次）：
#    copilot login
# 3. 验证 CLI 支持 ACP 协议：
#    copilot --help | findstr acp
# ==============================================================================

# 1. 注册并配置 github-copilot-acp 插件
- id: github-copilot-acp
  name: "@deepseek-ai/dsh-llm-copilot-acp"
  config:
    # Copilot CLI 可执行命令或路径
    # 默认值: copilot（或读取环境变量 COPILOT_ACP_COMMAND / COPILOT_CLI_PATH）
    command: copilot

    # 启动命令行参数，默认只包含 --acp
    # 可通过环境变量 COPILOT_ACP_ARGS 覆盖
    args:
      - "--acp"

    # 操作超时时间 (毫秒)，默认 15 分钟
    timeoutMs: 900000

    # 是否允许 Copilot 在会话目录内通过 ACP 文件桥读写
    allowFileRequests: false

    # 模型发现超时（毫秒）。发现失败时目录为空，不会填入猜出来的模型名。
    modelDiscoveryTimeoutMs: 10000

    # 可选：只有确认 Copilot 会话会提供这些 id 时才手写 models。
    # 写了之后就不再向 CLI 发现，错误 id 不会被自动替换。
    # models:
    #   - id: gpt-5.4
    #     name: GPT-5.4
    #     inputModalities:
    #       - text

# 2. （可选）将 github-copilot-acp 设为默认 Agent 模型
# - id: agent-default-model
#   name: "@deepseek-ai/dsh-agent-default-model"
#   config:
#     provider: github-copilot-acp
#     model: gpt-4o

# 3. （可选）在子智能体选择列表允许使用 github-copilot-acp 模型
# - id: subagent-model-selection-settings
#   name: "@deepseek-ai/dsh-tool-subagent/model-selection-settings"
#   config:
